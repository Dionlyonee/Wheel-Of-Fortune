<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dionlyonee LIVE — STREAM</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="game">


    <header>

        <div class="logo">
            D
        </div>

        <div>

            <h1>
                DIONLYONEE PLAYGROUND
            </h1>

            <p>
                WHEEL OF FORTUNE — LIVE
            </p>

        </div>

    </header>



    <main>


        <div class="category-label">
            CATEGORY
        </div>


        <div
            id="category"
            class="category"
        >
            WAITING FOR HOST
        </div>



        <div
            id="puzzle"
            class="puzzle"
        >
        </div>



        <div class="timer-label">
            NEXT LETTER
        </div>


        <div
            id="timer"
            class="timer"
        >
            —
        </div>


        <div class="seconds">
            SECONDS
        </div>



        <div
            id="message"
            class="message"
        >
            WAITING FOR GAME
        </div>



        <div class="live-status">

            <span class="connection-dot"></span>

            DIONLYONEE LIVE

        </div>


    </main>


</div>



<script>


/* =================================================
   CONNECT TO HOST
================================================= */

const gameChannel =
    new BroadcastChannel(
        "dionlyonee-live-game"
    );


/* =================================================
   ELEMENTS
================================================= */

const categoryElement =
    document.getElementById(
        "category"
    );


const puzzleElement =
    document.getElementById(
        "puzzle"
    );


const timerElement =
    document.getElementById(
        "timer"
    );


const messageElement =
    document.getElementById(
        "message"
    );


/* =================================================
   DRAW PUZZLE
================================================= */

function drawPuzzle(
    answer,
    revealed
) {


    puzzleElement.innerHTML =
        "";


    if (!answer) {

        return;

    }


    for (
        let i = 0;
        i < answer.length;
        i++
    ) {


        const character =
            answer[i];


        /* SPACE */

        if (
            character === " "
        ) {


            const space =
                document.createElement(
                    "div"
                );


            space.className =
                "space";


            puzzleElement.appendChild(
                space
            );


            continue;

        }


        /* LETTER BOX */

        const box =
            document.createElement(
                "div"
            );


        box.className =
            "letter";


        /*
        Only display letters that
        the host has revealed.
        */

        if (
            revealed &&
            revealed.includes(
                character
            )
        ) {

            box.textContent =
                character;

            box.classList.add(
                "revealed"
            );

        }


        puzzleElement.appendChild(
            box
        );

    }

}



/* =================================================
   RECEIVE HOST UPDATE
================================================= */

gameChannel.onmessage =
    function(event) {


        const state =
            event.data;


        console.log(
            "HOST UPDATE:",
            state
        );


        categoryElement.textContent =
            state.category ||
            "WAITING FOR HOST";


        drawPuzzle(

            state.answer,

            state.revealed || []

        );


        if (
            state.running
        ) {

            timerElement.textContent =
                state.seconds;

            messageElement.textContent =
                "GUESS THE ANSWER IN CHAT!";

        }

        else {

            timerElement.textContent =
                "—";

            messageElement.textContent =
                "WAITING FOR NEXT GAME";

        }


    };



/* =================================================
   BACKUP STATE
================================================= */

function loadBackupState() {


    const saved =
        localStorage.getItem(
            "dionlyoneeGameState"
        );


    if (!saved) {

        return;

    }


    try {


        const state =
            JSON.parse(
                saved
            );


        categoryElement.textContent =
            state.category ||
            "WAITING FOR HOST";


        drawPuzzle(

            state.answer,

            state.revealed || []

        );


        if (
            state.running
        ) {

            timerElement.textContent =
                state.seconds;

        }


    }

    catch (error) {

        console.log(
            "No backup game state."
        );

    }

}



/* =================================================
   LOAD BACKUP
================================================= */

loadBackupState();


console.log(
    "DIONLYONEE LIVE SCREEN CONNECTED"
);


</script>


</body>

</html>
```
