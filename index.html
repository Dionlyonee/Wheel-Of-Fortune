```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dionlyonee Playground</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="game">


        <header>

            <div class="logo">
                D
            </div>

            <div>

                <h1>
                    DIONLYONEE PLAYGROUND
                </h1>

                <p>
                    WHEEL OF FORTUNE
                </p>

            </div>

        </header>



        <main>


            <div class="category-label">
                CATEGORY
            </div>


            <div
                id="category"
                class="category"
            >
                GET READY!
            </div>



            <div
                id="puzzle"
                class="puzzle"
            >
            </div>



            <div class="timer-label">
                NEXT LETTER
            </div>


            <div
                id="timer"
                class="timer"
            >
                30
            </div>


            <div class="seconds">
                SECONDS
            </div>



            <div
                id="message"
                class="message"
            >
                CHOOSE A TIME AND START THE GAME
            </div>



            <div class="controls">


                <div class="setting">

                    <h3>
                        LETTER REVEAL
                    </h3>


                    <button
                        class="time-button"
                        data-time="15"
                    >
                        15 SEC
                    </button>


                    <button
                        class="time-button active"
                        data-time="30"
                    >
                        30 SEC
                    </button>


                    <button
                        class="time-button"
                        data-time="60"
                    >
                        1 MIN
                    </button>

                </div>



                <div class="setting">

                    <h3>
                        NEXT PUZZLE
                    </h3>


                    <button
                        class="cooldown-button"
                        data-time="5"
                    >
                        5 SEC
                    </button>


                    <button
                        class="cooldown-button active"
                        data-time="10"
                    >
                        10 SEC
                    </button>


                    <button
                        class="cooldown-button"
                        data-time="15"
                    >
                        15 SEC
                    </button>

                </div>



                <button
                    id="start"
                    class="start-button"
                >
                    ▶ START GAME
                </button>


            </div>


        </main>


    </div>


<script src="game.js"></script>

</body>

</html>
```
