```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dionlyonee Playground - Wheel of Fortune</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==========================================
         MAIN GAME
    =========================================== -->

    <div class="game-container">


        <!-- ======================================
             HEADER
        ======================================= -->

        <header class="header">

            <div class="logo">
                D
            </div>


            <div class="title-area">

                <h1>
                    DIONLYONEE PLAYGROUND
                </h1>

                <p>
                    WHEEL OF FORTUNE
                </p>

            </div>


            <button
                id="startTop"
                class="start-top"
            >
                ▶ START
            </button>

        </header>



        <!-- ======================================
             CATEGORY
        ======================================= -->

        <section class="category-area">

            <div class="small-title">
                CATEGORY
            </div>


            <div
                id="category"
                class="category"
            >
                GET READY!
            </div>

        </section>



        <!-- ======================================
             PUZZLE
        ======================================= -->

        <section
            id="puzzle"
            class="puzzle"
        >

        </section>



        <!-- ======================================
             TIMER
        ======================================= -->

        <section class="timer-area">

            <div class="timer-title">
                NEXT LETTER
            </div>


            <div
                id="timer"
                class="timer"
            >
                30
            </div>


            <div class="seconds">
                SECONDS
            </div>

        </section>



        <!-- ======================================
             MESSAGE
        ======================================= -->

        <div
            id="message"
            class="message"
        >
            CHOOSE YOUR TIME AND PRESS ENTER
        </div>



        <!-- ======================================
             CONTROLS
        ======================================= -->

        <section
            id="controls"
            class="controls"
        >


            <!-- LETTER REVEAL -->

            <div class="control-section">

                <div class="control-title">
                    LETTER REVEAL TIME
                </div>


                <div class="button-row">

                    <button
                        class="option-button time-option"
                        data-time="15"
                    >
                        15 SEC
                    </button>


                    <button
                        class="option-button time-option selected"
                        data-time="30"
                    >
                        30 SEC
                    </button>


                    <button
                        class="option-button time-option"
                        data-time="60"
                    >
                        1 MIN
                    </button>

                </div>

            </div>



            <!-- COOLDOWN -->

            <div class="control-section">

                <div class="control-title">
                    NEXT PUZZLE COOLDOWN
                </div>


                <div class="button-row">

                    <button
                        class="option-button cooldown-option"
                        data-cooldown="5"
                    >
                        5 SEC
                    </button>


                    <button
                        class="option-button cooldown-option selected"
                        data-cooldown="10"
                    >
                        10 SEC
                    </button>


                    <button
                        class="option-button cooldown-option"
                        data-cooldown="15"
                    >
                        15 SEC
                    </button>

                </div>

            </div>



            <!-- START -->

            <button
                id="startGame"
                class="start-game"
            >
                ▶ START GAME
            </button>


        </section>



        <!-- ======================================
             COOLDOWN SCREEN
        ======================================= -->

        <div
            id="cooldown"
            class="cooldown hidden"
        >

            <div class="cooldown-text">
                NEXT PUZZLE
            </div>


            <div
                id="cooldownNumber"
                class="cooldown-number"
            >
                10
            </div>

        </div>


    </div>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="game.js"></script>


</body>

</html>
```
