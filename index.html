<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dionlyonee LIVE - Wheel of Fortune</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

<div class="game">

    <!-- HEADER -->

    <header>

        <div class="logo">
            D
        </div>

        <div>

            <h1>DIONLYONEE PLAYGROUND</h1>

            <p>WHEEL OF FORTUNE - LIVE</p>

        </div>

    </header>


    <!-- LIVE GAME -->

    <main>

        <div class="category-label">
            CATEGORY
        </div>


        <div
            id="category"
            class="category"
        >
            WAITING
        </div>


        <!-- PUZZLE -->

        <div
            id="puzzle"
            class="puzzle"
        >
            <div class="waiting">
                WAITING FOR HOST
            </div>
        </div>


        <!-- TIMER -->

        <div class="timer-label">
            NEXT LETTER
        </div>


        <div
            id="timer"
            class="timer"
        >
            -
        </div>


        <div class="seconds">
            SECONDS
        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        >
            WAITING FOR GAME
        </div>


        <!-- LIVE -->

        <div class="live-status">

            <span class="connection-dot"></span>

            DIONLYONEE LIVE

        </div>

    </main>

</div>



<script>

/* =================================================
   LIVE GAME CONNECTION
================================================= */

/*
   This channel connects the LIVE screen
   to the HOST screen when both pages are
   open in the same browser.
*/

let gameChannel = null;


/*
   Some browsers support BroadcastChannel.
   If it is available, use it.
*/

if ("BroadcastChannel" in window) {

    gameChannel =
        new BroadcastChannel(
            "dionlyonee-wheel-game"
        );

}


/* =================================================
   PAGE ELEMENTS
================================================= */

const categoryElement =
    document.getElementById(
        "category"
    );


const puzzleElement =
    document.getElementById(
        "puzzle"
    );


const timerElement =
    document.getElementById(
        "timer"
    );


const messageElement =
    document.getElementById(
        "message"
    );



/* =================================================
   DRAW PUZZLE
================================================= */

function drawPuzzle(
    answer,
    revealed
) {

    puzzleElement.innerHTML = "";


    if (!answer) {

        puzzleElement.innerHTML =
            '<div class="waiting">WAITING FOR HOST</div>';

        return;

    }


    for (
        let i = 0;
        i < answer.length;
        i++
    ) {

        const character =
            answer[i];


        /*
           Space between words.
        */

        if (character === " ") {

            const space =
                document.createElement(
                    "div"
                );

            space.className = "space";

            puzzleElement.appendChild(
                space
            );

            continue;

        }


        /*
           Letter box.
        */

        const box =
            document.createElement(
                "div"
            );

        box.className = "letter";


        /*
           Only show revealed letters.
        */

        if (
            Array.isArray(revealed)
            &&
            revealed.includes(character)
        ) {

            box.textContent =
                character;

            box.classList.add(
                "revealed"
            );

        }


        puzzleElement.appendChild(
            box
        );

    }

}



/* =================================================
   RECEIVE HOST MESSAGE
================================================= */

if (gameChannel) {

    gameChannel.onmessage =
        function(event) {

            const state =
                event.data;


            if (!state) {

                return;

            }


            updateLiveScreen(
                state
            );

        };

}



/* =================================================
   UPDATE LIVE SCREEN
================================================= */

function updateLiveScreen(
    state
) {

    /*
       CATEGORY
    */

    categoryElement.textContent =
        state.category ||
        "WAITING";


    /*
       PUZZLE
    */

    drawPuzzle(

        state.answer || "",

        state.revealed || []

    );


    /*
       TIMER
    */

    if (state.running) {

        timerElement.textContent =
            state.seconds;


        messageElement.textContent =
            "GUESS THE ANSWER IN CHAT!";

    }

    else {

        timerElement.textContent =
            "-";


        messageElement.textContent =
            "WAITING FOR NEXT GAME";

    }

}


/* =================================================
   TEST MESSAGE
================================================= */

/*
   The LIVE page will display this in the
   browser console so we know the JavaScript
   loaded correctly.
*/

console.log(
    "DIONLYONEE LIVE PAGE LOADED"
);

</script>


</body>

</html>
