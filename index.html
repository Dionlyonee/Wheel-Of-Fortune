```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dionlyonee Playground</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="game">


    <!-- LOGO / TITLE -->

    <header>

        <div class="logo">
            D
        </div>

        <div>

            <h1>
                DIONLYONEE PLAYGROUND
            </h1>

            <p>
                LIVE GAME CENTER
            </p>

        </div>

    </header>



    <!-- LAUNCH SCREEN -->

    <main class="launch-screen">


        <div class="category-label">
            WHEEL OF FORTUNE
        </div>


        <h2>
            READY TO PLAY?
        </h2>


        <p class="launch-description">
            Choose which screen you want to open.
        </p>



        <!-- BUTTONS -->

        <div class="launch-buttons">


            <!-- LIVE -->

            <button
                class="launch-button live-button"
                onclick="openLive()"
            >

                <span class="button-icon">
                    📺
                </span>

                <span>
                    LIVE GAME
                </span>

                <small>
                    Stream this screen
                </small>

            </button>



            <!-- HOST -->

            <button
                class="launch-button host-button"
                onclick="openHost()"
            >

                <span class="button-icon">
                    🎤
                </span>

                <span>
                    HOST PANEL
                </span>

                <small>
                    Control the game
                </small>

            </button>


        </div>



        <div class="launch-note">

            Open both screens in separate tabs.

            <br>

            <strong>
                LIVE GAME
            </strong>
            is the screen you capture in Streamlabs.

        </div>


    </main>


</div>



<script>


/* =================================================
   OPEN LIVE
================================================= */

function openLive() {

    window.open(
        "live.html",
        "_blank"
    );

}



/* =================================================
   OPEN HOST
================================================= */

function openHost() {

    window.open(
        "host.html",
        "_blank"
    );

}


</script>


</body>

</html>
```
