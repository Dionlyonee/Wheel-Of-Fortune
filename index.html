```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dionlyonee Playground</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="game">


    <!-- HEADER -->

    <header>

        <div class="logo">
            D
        </div>

        <div>

            <h1>
                DIONLYONEE PLAYGROUND
            </h1>

            <p>
                WHEEL OF FORTUNE
            </p>

        </div>

    </header>



    <!-- START SCREEN -->

    <main
        id="startScreen"
        class="start-screen"
    >


        <div class="category-label">
            WELCOME
        </div>


        <h2>
            WHEEL OF FORTUNE
        </h2>


        <p class="welcome-text">

            Welcome to Dionlyonee Playground.

            <br><br>

            Choose how you want to enter the game.

        </p>



        <div class="mode-buttons">


            <!-- LIVE GAME -->

            <button
                id="liveButton"
                class="start-button"
            >

                🎮
                <br>

                LIVE GAME

                <span>
                    Stream Screen
                </span>

            </button>



            <!-- HOST -->

            <button
                id="hostButton"
                class="host-next-button"
            >

                🎛️
                <br>

                HOST PANEL

                <span>
                    Controls & Answer
                </span>

            </button>


        </div>


    </main>



    <!-- LIVE GAME SCREEN -->

    <main
        id="liveScreen"
        style="display:none;"
    >


        <div class="category-label">
            CATEGORY
        </div>


        <div
            id="category"
            class="category"
        >
            GET READY!
        </div>



        <div
            id="puzzle"
            class="puzzle"
        >
        </div>



        <div class="timer-label">
            NEXT LETTER
        </div>


        <div
            id="timer"
            class="timer"
        >
            30
        </div>


        <div class="seconds">
            SECONDS
        </div>


        <div
            id="message"
            class="message"
        >
            WAITING FOR HOST
        </div>


    </main>


</div>



<script>


/* =================================================
   OPEN LIVE GAME
================================================= */

document
    .getElementById("liveButton")
    .addEventListener(
        "click",
        function() {


            document
                .getElementById(
                    "startScreen"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "liveScreen"
                )
                .style.display =
                "block";


        }
    );



/* =================================================
   OPEN HOST PANEL
================================================= */

document
    .getElementById("hostButton")
    .addEventListener(
        "click",
        function() {


            window.open(
                "host.html",
                "_blank"
            );


        }
    );


</script>


</body>

</html>
```
