```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dionlyonee Playground - Wheel of Fortune</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="game-screen">


        <!-- HEADER -->

        <header class="game-header">

            <div class="logo">
                🎮
            </div>

            <div class="brand">

                <h1>
                    DIONLYONEE PLAYGROUND
                </h1>

                <p>
                    WHEEL OF FORTUNE
                </p>

            </div>

            <button
                id="topStartButton"
                class="top-start-button"
                type="button"
            >
                ▶ START
            </button>

        </header>



        <!-- GAME -->

        <section class="game-area">

            <div class="category-section">

                <span class="category-label">
                    CATEGORY
                </span>

                <h2 id="categoryDisplay">
                    GET READY!
                </h2>

            </div>


            <div
                id="puzzleDisplay"
                class="puzzle-display"
            >

            </div>


            <div class="timer-section">

                <div class="timer-label">
                    NEXT LETTER
                </div>

                <div
                    id="timerDisplay"
                    class="timer-display"
                >
                    30
                </div>

                <div class="timer-seconds">
                    SECONDS
                </div>

            </div>


            <div
                id="gameMessage"
                class="game-message"
            >
                CHOOSE YOUR SETTINGS AND PRESS ENTER
            </div>

        </section>



        <!-- SETTINGS -->

        <section
            id="settingsPanel"
            class="settings-panel"
        >

            <div class="settings-header">

                <h3>
                    GAME SETTINGS
                </h3>

                <span>
                    HOST
                </span>

            </div>


            <!-- LETTER TIME -->

            <div class="setting-group">

                <label>
                    LETTER REVEAL TIME
                </label>

                <div class="setting-buttons">

                    <button
                        type="button"
                        class="time-button"
                        data-time="15"
                    >
                        15 SEC
                    </button>

                    <button
                        type="button"
                        class="time-button active"
                        data-time="30"
                    >
                        30 SEC
                    </button>

                    <button
                        type="button"
                        class="time-button"
                        data-time="60"
                    >
                        1 MIN
                    </button>

                </div>

            </div>



            <!-- COOLDOWN -->

            <div class="setting-group">

                <label>
                    NEXT ROUND COOLDOWN
                </label>

                <div class="setting-buttons">

                    <button
                        type="button"
                        class="cooldown-button"
                        data-cooldown="5"
                    >
                        5 SEC
                    </button>

                    <button
                        type="button"
                        class="cooldown-button active"
                        data-cooldown="10"
                    >
                        10 SEC
                    </button>

                    <button
                        type="button"
                        class="cooldown-button"
                        data-cooldown="15"
                    >
                        15 SEC
                    </button>

                </div>

            </div>



            <!-- START -->

            <button
                id="startGameButton"
                class="start-game-button"
                type="button"
            >
                ▶ START GAME
            </button>

        </section>



        <!-- COOLDOWN -->

        <div
            id="cooldownDisplay"
            class="cooldown-display hidden"
        >

            <div class="cooldown-title">
                NEXT PUZZLE
            </div>

            <div
                id="cooldownTimer"
                class="cooldown-timer"
            >
                10
            </div>

        </div>


    </main>


    <!-- IMPORTANT:
         JAVASCRIPT IS LOADED LAST -->

    <script src="./game.js"></script>

</body>

</html>
```
