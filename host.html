<script>

/* =================================================
   DIONLYONEE WHEEL OF FORTUNE
   HOST CONTROLLER
================================================= */


/* =================================================
   LIVE CONNECTION
================================================= */

/*
   IMPORTANT:

   This name MUST be identical to the
   BroadcastChannel name in index.html.
*/

let gameChannel = null;


if ("BroadcastChannel" in window) {

    gameChannel =
        new BroadcastChannel(
            "dionlyonee-wheel-game"
        );

}


/* =================================================
   PUZZLE DATABASE
================================================= */

const puzzles = {

    "Countries": [

        "JAMAICA",
        "CANADA",
        "BRAZIL",
        "JAPAN",
        "MEXICO",
        "BAHAMAS",
        "BARBADOS",
        "FRANCE",
        "GERMANY",
        "AUSTRALIA"

    ],


    "Animals": [

        "ELEPHANT",
        "GIRAFFE",
        "MONKEY",
        "DOLPHIN",
        "CROCODILE",
        "KANGAROO",
        "TIGER",
        "GORILLA",
        "PENGUIN",
        "ZEBRA"

    ],


    "Jamaican Phrases": [

        "WAH GWAAN",
        "WEH YUH A SEH",
        "MI DEH YA",
        "EVERYTING IRIE",
        "BIG UP",
        "WALK GOOD",
        "NO PROBLEM",
        "MEK WE GO"

    ],


    "Food": [

        "JERK CHICKEN",
        "RICE AND PEAS",
        "PIZZA",
        "HAMBURGER",
        "ICE CREAM",
        "FRIED CHICKEN",
        "CURRY GOAT"

    ]

};


/* =================================================
   GAME SETTINGS
================================================= */

let revealTime = 30;

let cooldownTime = 10;


/* =================================================
   GAME VARIABLES
================================================= */

let answer = "";

let category = "";

let revealed = [];

let seconds = 30;

let timer = null;

let gameRunning = false;


/* =================================================
   PAGE ELEMENTS
================================================= */

const hostCategory =
    document.getElementById(
        "hostCategory"
    );


const hostAnswer =
    document.getElementById(
        "hostAnswer"
    );


const hostLetters =
    document.getElementById(
        "hostLetters"
    );


const hostTimer =
    document.getElementById(
        "hostTimer"
    );


const hostMessage =
    document.getElementById(
        "hostMessage"
    );


const hostStart =
    document.getElementById(
        "hostStart"
    );


const hostNext =
    document.getElementById(
        "hostNext"
    );


const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );



/* =================================================
   SEND GAME TO LIVE
================================================= */

function sendToLive() {


    const state = {

        category: category,

        answer: answer,

        revealed: revealed,

        seconds: seconds,

        running: gameRunning

    };


    /*
       Send directly to LIVE tab.
    */

    if (gameChannel) {

        gameChannel.postMessage(
            state
        );

    }


    /*
       Also save a copy locally.
    */

    localStorage.setItem(

        "dionlyoneeGameState",

        JSON.stringify(
            state
        )

    );

}



/* =================================================
   START GAME
================================================= */

function startGame() {


    clearInterval(
        timer
    );


    const categories =
        Object.keys(
            puzzles
        );


    /*
       Pick random category.
    */

    category =
        categories[
            Math.floor(
                Math.random() *
                categories.length
            )
        ];


    /*
       Pick random answer.
    */

    const categoryWords =
        puzzles[
            category
        ];


    answer =
        categoryWords[
            Math.floor(
                Math.random() *
                categoryWords.length
            )
        ];


    /*
       Reset letters.
    */

    revealed = [];


    /*
       Reset timer.
    */

    seconds =
        revealTime;


    /*
       Game is now running.
    */

    gameRunning = true;


    /*
       Update Host screen.
    */

    hostCategory.textContent =
        category;


    hostAnswer.textContent =
        answer;


    hostLetters.textContent =
        "NONE";


    hostTimer.textContent =
        seconds;


    hostMessage.textContent =
        "GAME LIVE - WATCH THE CHAT";


    /*
       Send everything to LIVE.
    */

    sendToLive();


    /*
       Start countdown.
    */

    timer =
        setInterval(
            countdown,
            1000
        );

}



/* =================================================
   COUNTDOWN
================================================= */

function countdown() {


    seconds--;


    hostTimer.textContent =
        seconds;


    /*
       Keep LIVE synchronized.
    */

    sendToLive();


    /*
       Time to reveal.
    */

    if (
        seconds <= 0
    ) {

        revealLetter();

    }

}



/* =================================================
   REVEAL LETTER
================================================= */

function revealLetter() {


    clearInterval(
        timer
    );


    /*
       Find letters that haven't
       been revealed yet.
    */

    const hiddenLetters =
        [
            ...new Set(

                answer
                    .split("")
                    .filter(
                        function(letter) {

                            return (

                                letter !== " "

                                &&

                                !revealed.includes(
                                    letter
                                )

                            );

                        }
                    )

            )
        ];


    /*
       If there are no letters left,
       finish the puzzle.
    */

    if (
        hiddenLetters.length === 0
    ) {

        finishGame();

        return;

    }


    /*
       Pick a random hidden letter.
    */

    const randomIndex =
        Math.floor(
            Math.random() *
            hiddenLetters.length
        );


    const letter =
        hiddenLetters[
            randomIndex
        ];


    /*
       Add letter to revealed list.
    */

    revealed.push(
        letter
    );


    /*
       Update Host.
    */

    hostLetters.textContent =
        revealed.join(
            " • "
        );


    hostMessage.textContent =
        "LETTER REVEALED: " +
        letter;


    /*
       Update LIVE.
    */

    sendToLive();


    /*
       Check if every letter is revealed.
    */

    if (
        puzzleComplete()
    ) {

        finishGame();

        return;

    }


    /*
       Reset countdown.
    */

    seconds =
        revealTime;


    hostTimer.textContent =
        seconds;


    sendToLive();


    timer =
        setInterval(
            countdown,
            1000
        );

}



/* =================================================
   CHECK PUZZLE
================================================= */

function puzzleComplete() {


    for (
        let i = 0;
        i < answer.length;
        i++
    ) {


        const letter =
            answer[i];


        /*
           Ignore spaces.
        */

        if (
            letter === " "
        ) {

            continue;

        }


        /*
           Letter still hidden.
        */

        if (
            !revealed.includes(
                letter
            )
        ) {

            return false;

        }

    }


    return true;

}



/* =================================================
   FINISH GAME
================================================= */

function finishGame() {


    clearInterval(
        timer
    );


    gameRunning = false;


    hostTimer.textContent =
        "✓";


    hostMessage.textContent =
        "PUZZLE COMPLETE";


    /*
       Tell LIVE that the puzzle
       has finished.
    */

    sendToLive();


    /*
       Automatically start another
       puzzle after cooldown.
    */

    setTimeout(
        function() {

            startGame();

        },
        cooldownTime * 1000
    );

}



/* =================================================
   START BUTTON
================================================= */

hostStart.addEventListener(
    "click",
    function() {

        startGame();

    }
);



/* =================================================
   NEXT PUZZLE
================================================= */

hostNext.addEventListener(
    "click",
    function() {

        startGame();

    }
);



/* =================================================
   ENTER KEY
================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Enter"
            &&
            !gameRunning
        ) {

            startGame();

        }

    }
);



/* =================================================
   LETTER TIMER BUTTONS
================================================= */

document
    .querySelectorAll(
        ".host-time-button"
    )
    .forEach(
        function(button) {


            button.addEventListener(
                "click",
                function() {


                    /*
                       Don't change timer
                       while game is running.
                    */

                    if (gameRunning) {

                        return;

                    }


                    document
                        .querySelectorAll(
                            ".host-time-button"
                        )
                        .forEach(
                            function(item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    revealTime =
                        Number(
                            button.dataset.time
                        );


                    seconds =
                        revealTime;


                    hostTimer.textContent =
                        seconds;


                    hostMessage.textContent =
                        "REVEAL EVERY " +
                        revealTime +
                        " SECONDS";


                }
            );

        }
    );



/* =================================================
   COOLDOWN BUTTONS
================================================= */

document
    .querySelectorAll(
        ".host-cooldown-button"
    )
    .forEach(
        function(button) {


            button.addEventListener(
                "click",
                function() {


                    if (gameRunning) {

                        return;

                    }


                    document
                        .querySelectorAll(
                            ".host-cooldown-button"
                        )
                        .forEach(
                            function(item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    cooldownTime =
                        Number(
                            button.dataset.time
                        );


                    hostMessage.textContent =
                        "COOLDOWN: " +
                        cooldownTime +
                        " SECONDS";


                }
            );

        }
    );



/* =================================================
   INITIAL CONNECTION
================================================= */

if (gameChannel) {

    connectionStatus.innerHTML =
        '<span class="connection-dot"></span>' +
        ' LIVE CHANNEL READY';

}
else {

    connectionStatus.innerHTML =
        '<span class="connection-dot"></span>' +
        ' BROWSER CONNECTION NOT AVAILABLE';

}


/* =================================================
   INITIAL STATE
================================================= */

sendToLive();


console.log(
    "DIONLYONEE HOST CONTROLLER READY"
);

</script>


</body>

</html>
