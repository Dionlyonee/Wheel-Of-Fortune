/* =========================================
   GAME VARIABLES
========================================= */

let revealTime = 30;

let timer = null;

let seconds = 30;

let running = false;

let currentAnswer = "";


/* =========================================
   ELEMENTS
========================================= */

const categoryDisplay =
    document.getElementById("category");

const answerDisplay =
    document.getElementById("answer");

const timerDisplay =
    document.getElementById("timer");

const messageDisplay =
    document.getElementById("message");


/* =========================================
   START GAME
========================================= */

function startGame() {

    clearInterval(timer);

    running = true;

    const categories =
        Object.keys(puzzles);

    const randomCategory =
        categories[
            Math.floor(
                Math.random() * categories.length
            )
        ];

    const words =
        puzzles[randomCategory];

    currentAnswer =
        words[
            Math.floor(
                Math.random() * words.length
            )
        ];

    seconds = revealTime;

    categoryDisplay.textContent =
        randomCategory;

    answerDisplay.textContent =
        currentAnswer;

    timerDisplay.textContent =
        seconds;

    messageDisplay.textContent =
        "GAME IS LIVE";

    timer =
        setInterval(function() {

            seconds--;

            timerDisplay.textContent =
                seconds;

            if (seconds <= 0) {

                clearInterval(timer);

                messageDisplay.textContent =
                    "LETTER REVEAL";

                seconds = revealTime;

                timerDisplay.textContent =
                    seconds;

                timer =
                    setInterval(function() {

                        seconds--;

                        timerDisplay.textContent =
                            seconds;

                    }, 1000);

            }

        }, 1000);

}


/* =========================================
   NEXT PUZZLE
========================================= */

function nextGame() {

    startGame();

}


/* =========================================
   CHANGE TIME
========================================= */

function setTime(time) {

    if (running) {

        messageDisplay.textContent =
            "STOP THE CURRENT GAME BEFORE CHANGING TIME";

        return;

    }

    revealTime = time;

    seconds = time;

    timerDisplay.textContent =
        time;


    document
        .querySelectorAll(".time")
        .forEach(function(button) {

            button.classList.remove("active");

        });


    if (time === 15) {

        document
            .getElementById("time15")
            .classList.add("active");

    }

    if (time === 30) {

        document
            .getElementById("time30")
            .classList.add("active");

    }

    if (time === 60) {

        document
            .getElementById("time60")
            .classList.add("active");

    }

}


/* =========================================
   ENTER KEY
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !running
        ) {

            startGame();

        }

    }
);
