```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dionlyonee HOST Panel</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<div class="game">


    <!-- HEADER -->

    <header>

        <div class="logo">
            D
        </div>

        <div>

            <h1>DIONLYONEE PLAYGROUND</h1>

            <p>HOST CONTROL PANEL</p>

        </div>

    </header>



    <main>


        <!-- CATEGORY -->

        <div class="category-label">
            CURRENT CATEGORY
        </div>


        <div id="hostCategory"
             class="category">

            WAITING

        </div>



        <!-- ANSWER -->

        <div class="category-label">
            ANSWER
        </div>


        <div id="hostAnswer"
             class="host-answer">

            —

        </div>



        <!-- REVEALED LETTERS -->

        <div class="category-label">
            REVEALED LETTERS
        </div>


        <div id="hostLetters"
             class="host-letters">

            NONE

        </div>



        <!-- TIMER -->

        <div class="timer-label">
            NEXT LETTER
        </div>


        <div id="hostTimer"
             class="timer">

            30

        </div>


        <div class="seconds">
            SECONDS
        </div>



        <!-- STATUS -->

        <div id="hostMessage"
             class="message">

            READY TO START

        </div>



        <!-- SETTINGS -->

        <section class="host-settings">


            <!-- LETTER TIMER -->

            <div class="setting">

                <h3>
                    LETTER REVEAL
                </h3>


                <button
                    class="host-time-button"
                    data-time="15">

                    15 SEC

                </button>


                <button
                    class="host-time-button active"
                    data-time="30">

                    30 SEC

                </button>


                <button
                    class="host-time-button"
                    data-time="60">

                    1 MIN

                </button>

            </div>



            <!-- COOLDOWN -->

            <div class="setting">

                <h3>
                    NEXT PUZZLE COOLDOWN
                </h3>


                <button
                    class="host-cooldown-button"
                    data-time="5">

                    5 SEC

                </button>


                <button
                    class="host-cooldown-button active"
                    data-time="10">

                    10 SEC

                </button>


                <button
                    class="host-cooldown-button"
                    data-time="15">

                    15 SEC

                </button>

            </div>


        </section>



        <!-- CONTROLS -->

        <div class="controls">


            <button
                id="hostStart"
                class="start-button">

                START GAME

            </button>


            <button
                id="hostNext"
                class="host-next-button">

                NEXT PUZZLE

            </button>


        </div>



        <!-- CONNECTION -->

        <div id="connectionStatus"
             class="live-status">

            <span class="connection-dot"></span>

            HOST READY

        </div>


    </main>

</div>



<script>


/* =====================================================
   DIONLYONEE PLAYGROUND
   HOST CONTROLLER
===================================================== */


/* =====================================================
   LIVE CONNECTION
===================================================== */

let gameChannel = null;


if (
    "BroadcastChannel" in window
) {

    gameChannel =
        new BroadcastChannel(
            "dionlyonee-wheel-game"
        );

}



/* =====================================================
   PUZZLES
===================================================== */

const puzzles = {

    "Countries": [

        "JAMAICA",
        "CANADA",
        "BRAZIL",
        "JAPAN",
        "MEXICO",
        "BAHAMAS",
        "BARBADOS",
        "FRANCE",
        "GERMANY",
        "AUSTRALIA"

    ],


    "Animals": [

        "ELEPHANT",
        "GIRAFFE",
        "MONKEY",
        "DOLPHIN",
        "CROCODILE",
        "KANGAROO",
        "TIGER",
        "GORILLA",
        "PENGUIN",
        "ZEBRA"

    ],


    "Jamaican Phrases": [

        "WAH GWAAN",
        "WEH YUH A SEH",
        "MI DEH YA",
        "EVERYTING IRIE",
        "BIG UP",
        "WALK GOOD",
        "NO PROBLEM",
        "MEK WE GO"

    ],


    "Food": [

        "JERK CHICKEN",
        "RICE AND PEAS",
        "PIZZA",
        "HAMBURGER",
        "ICE CREAM",
        "FRIED CHICKEN",
        "CURRY GOAT"

    ]

};



/* =====================================================
   SETTINGS
===================================================== */

let revealTime = 30;

let cooldownTime = 10;



/* =====================================================
   GAME STATE
===================================================== */

let answer = "";

let category = "";

let revealed = [];

let seconds = 30;

let timer = null;

let gameRunning = false;



/* =====================================================
   ELEMENTS
===================================================== */

const hostCategory =
    document.getElementById(
        "hostCategory"
    );


const hostAnswer =
    document.getElementById(
        "hostAnswer"
    );


const hostLetters =
    document.getElementById(
        "hostLetters"
    );


const hostTimer =
    document.getElementById(
        "hostTimer"
    );


const hostMessage =
    document.getElementById(
        "hostMessage"
    );


const hostStart =
    document.getElementById(
        "hostStart"
    );


const hostNext =
    document.getElementById(
        "hostNext"
    );


const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );



/* =====================================================
   SEND TO LIVE
===================================================== */

function sendToLive() {


    const state = {

        category: category,

        answer: answer,

        revealed: revealed,

        seconds: seconds,

        running: gameRunning

    };


    if (
        gameChannel
    ) {

        gameChannel.postMessage(
            state
        );

    }


    /*
       Backup.
    */

    localStorage.setItem(

        "dionlyoneeGameState",

        JSON.stringify(
            state
        )

    );

}



/* =====================================================
   START GAME
===================================================== */

function startGame() {


    clearInterval(
        timer
    );


    const categories =
        Object.keys(
            puzzles
        );


    category =
        categories[
            Math.floor(
                Math.random() *
                categories.length
            )
        ];


    const words =
        puzzles[
            category
        ];


    answer =
        words[
            Math.floor(
                Math.random() *
                words.length
            )
        ];


    revealed = [];


    seconds =
        revealTime;


    gameRunning = true;


    hostCategory.textContent =
        category;


    hostAnswer.textContent =
        answer;


    hostLetters.textContent =
        "NONE";


    hostTimer.textContent =
        seconds;


    hostMessage.textContent =
        "GAME LIVE - WATCH THE CHAT";


    sendToLive();


    timer =
        setInterval(
            countdown,
            1000
        );

}



/* =====================================================
   COUNTDOWN
===================================================== */

function countdown() {


    seconds--;


    hostTimer.textContent =
        seconds;


    sendToLive();


    if (
        seconds <= 0
    ) {

        revealLetter();

    }

}



/* =====================================================
   REVEAL LETTER
===================================================== */

function revealLetter() {


    clearInterval(
        timer
    );


    const hiddenLetters =
        [
            ...new Set(

                answer
                    .split("")
                    .filter(
                        function(letter) {

                            return (

                                letter !== " "

                                &&

                                !revealed.includes(
                                    letter
                                )

                            );

                        }
                    )

            )
        ];


    if (
        hiddenLetters.length === 0
    ) {

        finishGame();

        return;

    }


    const randomIndex =
        Math.floor(
            Math.random() *
            hiddenLetters.length
        );


    const letter =
        hiddenLetters[
            randomIndex
        ];


    revealed.push(
        letter
    );


    hostLetters.textContent =
        revealed.join(
            " • "
        );


    hostMessage.textContent =
        "LETTER REVEALED: " +
        letter;


    sendToLive();


    if (
        puzzleComplete()
    ) {

        finishGame();

        return;

    }


    seconds =
        revealTime;


    hostTimer.textContent =
        seconds;


    sendToLive();


    timer =
        setInterval(
            countdown,
            1000
        );

}



/* =====================================================
   CHECK PUZZLE
===================================================== */

function puzzleComplete() {


    for (
        let i = 0;
        i < answer.length;
        i++
    ) {


        const letter =
            answer[i];


        if (
            letter === " "
        ) {

            continue;

        }


        if (
            !revealed.includes(
                letter
            )
        ) {

            return false;

        }

    }


    return true;

}



/* =====================================================
   FINISH
===================================================== */

function finishGame() {


    clearInterval(
        timer
    );


    gameRunning = false;


    hostTimer.textContent =
        "✓";


    hostMessage.textContent =
        "PUZZLE COMPLETE";


    sendToLive();


    setTimeout(
        function() {

            startGame();

        },
        cooldownTime * 1000
    );

}



/* =====================================================
   START BUTTON
===================================================== */

hostStart.addEventListener(
    "click",
    function() {

        startGame();

    }
);



/* =====================================================
   NEXT BUTTON
===================================================== */

hostNext.addEventListener(
    "click",
    function() {

        startGame();

    }
);



/* =====================================================
   ENTER KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Enter"
            &&
            !gameRunning
        ) {

            startGame();

        }

    }
);



/* =====================================================
   TIMER BUTTONS
===================================================== */

document
    .querySelectorAll(
        ".host-time-button"
    )
    .forEach(
        function(button) {


            button.addEventListener(
                "click",
                function() {


                    if (
                        gameRunning
                    ) {

                        return;

                    }


                    document
                        .querySelectorAll(
                            ".host-time-button"
                        )
                        .forEach(
                            function(item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    revealTime =
                        Number(
                            button.dataset.time
                        );


                    seconds =
                        revealTime;


                    hostTimer.textContent =
                        seconds;

                }
            );

        }
    );



/* =====================================================
   COOLDOWN BUTTONS
===================================================== */

document
    .querySelectorAll(
        ".host-cooldown-button"
    )
    .forEach(
        function(button) {


            button.addEventListener(
                "click",
                function() {


                    if (
                        gameRunning
                    ) {

                        return;

                    }


                    document
                        .querySelectorAll(
                            ".host-cooldown-button"
                        )
                        .forEach(
                            function(item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    cooldownTime =
                        Number(
                            button.dataset.time
                        );


                    hostMessage.textContent =
                        "COOLDOWN: " +
                        cooldownTime +
                        " SECONDS";

                }
            );

        }
    );



/* =====================================================
   CONNECTION STATUS
===================================================== */

if (
    gameChannel
) {

    connectionStatus.innerHTML =
        '<span class="connection-dot"></span>' +
        ' LIVE CHANNEL READY';

}
else {

    connectionStatus.innerHTML =
        '<span class="connection-dot"></span>' +
        ' CONNECTION NOT AVAILABLE';

}


console.log(
    "DIONLYONEE HOST READY"
);

</script>


</body>

</html>
