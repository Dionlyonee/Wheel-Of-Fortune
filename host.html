/* =========================================
   GAME SETTINGS
========================================= */


let revealTime = 30;

let seconds = 30;

let gameTimer = null;

let gameRunning = false;



/* =========================================
   ELEMENTS
========================================= */


const categoryElement =
document.getElementById("category");


const answerElement =
document.getElementById("answer");


const timerElement =
document.getElementById("timer");


const messageElement =
document.getElementById("message");


const startButton =
document.getElementById("startButton");


const nextButton =
document.getElementById("nextButton");


const time15 =
document.getElementById("time15");


const time30 =
document.getElementById("time30");


const time60 =
document.getElementById("time60");



/* =========================================
   GET RANDOM PUZZLE
========================================= */


function getPuzzle() {


const categories =
Object.keys(puzzles);


const randomCategory =
categories[
Math.floor(
Math.random() *
categories.length
)
];


const words =
puzzles[randomCategory];


const randomWord =
words[
Math.floor(
Math.random() *
words.length
)
];


return {

category: randomCategory,

answer: randomWord

};

}



/* =========================================
   START GAME
========================================= */


function startGame() {


clearInterval(gameTimer);


const puzzle =
getPuzzle();


categoryElement.textContent =
puzzle.category;


answerElement.textContent =
puzzle.answer;


seconds =
revealTime;


timerElement.textContent =
seconds;


messageElement.textContent =
"GAME IS LIVE";


gameRunning = true;


gameTimer =
setInterval(

function() {


seconds--;


timerElement.textContent =
seconds;


if (seconds <= 0) {


clearInterval(gameTimer);


messageElement.textContent =
"NEXT LETTER REVEAL";


seconds =
revealTime;


timerElement.textContent =
seconds;


gameTimer =
setInterval(

function() {


seconds--;


timerElement.textContent =
seconds;


if (seconds <= 0) {

seconds =
revealTime;

timerElement.textContent =
seconds;

}

},

1000

);


}

},

1000

);

}



/* =========================================
   NEXT PUZZLE
========================================= */


function nextPuzzle() {

startGame();

}



/* =========================================
   CHANGE TIME
========================================= */


function changeTime(time) {


revealTime =
time;


seconds =
time;


timerElement.textContent =
time;


time15.classList.remove("selected");

time30.classList.remove("selected");

time60.classList.remove("selected");


if (time === 15) {

time15.classList.add("selected");

}


if (time === 30) {

time30.classList.add("selected");

}


if (time === 60) {

time60.classList.add("selected");

}


messageElement.textContent =
"REVEAL TIME: " +
time +
" SECONDS";

}
