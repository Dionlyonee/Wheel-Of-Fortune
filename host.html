<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dionlyonee Playground HOST</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="host-screen">
  <header class="host-header">
    <div class="host-logo">D</div>
    <div>
      <h1>DIONLYONEE PLAYGROUND</h1>
      <p>HOST CONTROL PANEL</p>
    </div>
  </header>
  <main class="host-main">
    <div class="host-status">HOST CONTROL</div>
    <div class="host-label">CATEGORY</div>
    <div id="hostCategory" class="host-category">READY</div>
    <div class="host-label">ANSWER</div>
    <div id="answer" class="host-answer">—</div>
    <div class="host-label">REVEALED LETTERS</div>
    <div id="revealed" class="host-revealed">NONE</div>
    <div class="host-label">NEXT LETTER</div>
    <div id="hostTimer" class="host-timer">30</div>

    <section class="host-settings">
      <div class="host-setting">
        <h3>LETTER REVEAL</h3>
        <button class="time-button" data-time="15">15 SEC</button>
        <button class="time-button active" data-time="30">30 SEC</button>
        <button class="time-button" data-time="60">1 MIN</button>
      </div>
      <div class="host-setting">
        <h3>NEXT PUZZLE COOLDOWN</h3>
        <button class="cooldown-button" data-time="5">5 SEC</button>
        <button class="cooldown-button active" data-time="10">10 SEC</button>
        <button class="cooldown-button" data-time="15">15 SEC</button>
      </div>
    </section>

    <div class="host-controls">
      <button id="start" class="start-game">START GAME</button>
      <button id="next" class="next-game">NEXT PUZZLE</button>
    </div>
    <div id="hostMessage" class="host-message">READY TO START</div>
  </main>
</div>

<script>
const channel = new BroadcastChannel("dionlyonee-wheel-game");

const puzzles = {
  Countries: ["JAMAICA","CANADA","BRAZIL","JAPAN","MEXICO","BAHAMAS","BARBADOS","FRANCE","GERMANY","AUSTRALIA"],
  Animals: ["ELEPHANT","GIRAFFE","MONKEY","DOLPHIN","CROCODILE","KANGAROO","TIGER","GORILLA","PENGUIN","ZEBRA"],
  "Jamaican Phrases": ["WAH GWAAN","WEH YUH A SEH","MI DEH YA","EVERYTING IRIE","BIG UP","WALK GOOD","NO PROBLEM","MEK WE GO"],
  Food: ["JERK CHICKEN","RICE AND PEAS","PIZZA","HAMBURGER","ICE CREAM","FRIED CHICKEN","CURRY GOAT"]
};

let revealTime = 30;
let cooldownTime = 10;
let answer = "";
let category = "";
let revealed = [];
let seconds = 30;
let running = false;
let timer = null;

const hostCategory = document.getElementById("hostCategory");
const answerElement = document.getElementById("answer");
const revealedElement = document.getElementById("revealed");
const timerElement = document.getElementById("hostTimer");
const messageElement = document.getElementById("hostMessage");

function sendGame() {
  channel.postMessage({category, answer, revealed, seconds, running});
}

function startGame() {
  clearInterval(timer);
  const categories = Object.keys(puzzles);
  category = categories[Math.floor(Math.random() * categories.length)];
  const words = puzzles[category];
  answer = words[Math.floor(Math.random() * words.length)];
  revealed = [];
  seconds = revealTime;
  running = true;

  hostCategory.textContent = category;
  answerElement.textContent = answer;
  revealedElement.textContent = "NONE";
  timerElement.textContent = seconds;
  messageElement.textContent = "GAME IS LIVE";
  sendGame();
  timer = setInterval(tick, 1000);
}

function tick() {
  seconds--;
  timerElement.textContent = seconds;
  sendGame();
  if (seconds <= 0) revealLetter();
}

function revealLetter() {
  clearInterval(timer);
  const hidden = [...new Set(answer.split("").filter(letter =>
    letter !== " " && !revealed.includes(letter)
  ))];

  if (!hidden.length) {
    finishGame();
    return;
  }

  const letter = hidden[Math.floor(Math.random() * hidden.length)];
  revealed.push(letter);
  revealedElement.textContent = revealed.join(" • ");
  messageElement.textContent = "REVEALED: " + letter;
  seconds = revealTime;
  timerElement.textContent = seconds;
  sendGame();

  if (puzzleComplete()) {
    finishGame();
    return;
  }

  timer = setInterval(tick, 1000);
}

function puzzleComplete() {
  for (const letter of answer) {
    if (letter !== " " && !revealed.includes(letter)) return false;
  }
  return true;
}

function finishGame() {
  clearInterval(timer);
  running = false;
  messageElement.textContent = "PUZZLE COMPLETE";
  timerElement.textContent = "✓";
  sendGame();
  setTimeout(startGame, cooldownTime * 1000);
}

document.getElementById("start").addEventListener("click", startGame);
document.getElementById("next").addEventListener("click", startGame);

document.addEventListener("keydown", event => {
  if (event.key === "Enter" && !running) startGame();
});

document.querySelectorAll(".time-button").forEach(button => {
  button.addEventListener("click", () => {
    if (running) return;
    document.querySelectorAll(".time-button").forEach(item => item.classList.remove("active"));
    button.classList.add("active");
    revealTime = Number(button.dataset.time);
    seconds = revealTime;
    timerElement.textContent = seconds;
  });
});

document.querySelectorAll(".cooldown-button").forEach(button => {
  button.addEventListener("click", () => {
    if (running) return;
    document.querySelectorAll(".cooldown-button").forEach(item => item.classList.remove("active"));
    button.classList.add("active");
    cooldownTime = Number(button.dataset.time);
  });
});
</script>
</body>
</html>
