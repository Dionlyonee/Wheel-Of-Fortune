```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dionlyonee LIVE — HOST</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="game">


    <header>

        <div class="logo">
            D
        </div>

        <div>

            <h1>
                DIONLYONEE PLAYGROUND
            </h1>

            <p>
                HOST CONTROL PANEL
            </p>

        </div>

    </header>



    <main>


        <div class="category-label">
            CURRENT CATEGORY
        </div>


        <div
            id="hostCategory"
            class="category"
        >
            WAITING
        </div>



        <div class="category-label">
            ANSWER
        </div>


        <div
            id="hostAnswer"
            class="host-answer"
        >
            —
        </div>



        <div class="category-label">
            REVEALED LETTERS
        </div>


        <div
            id="hostLetters"
            class="host-letters"
        >
            NONE
        </div>



        <div class="timer-label">
            NEXT LETTER
        </div>


        <div
            id="hostTimer"
            class="timer"
        >
            30
        </div>


        <div class="seconds">
            SECONDS
        </div>



        <div
            id="hostMessage"
            class="message"
        >
            READY TO START
        </div>



        <section class="host-settings">


            <div class="setting">

                <h3>
                    LETTER REVEAL
                </h3>


                <button
                    class="host-time-button"
                    data-time="15"
                >
                    15 SEC
                </button>


                <button
                    class="host-time-button active"
                    data-time="30"
                >
                    30 SEC
                </button>


                <button
                    class="host-time-button"
                    data-time="60"
                >
                    1 MIN
                </button>

            </div>



            <div class="setting">

                <h3>
                    NEXT PUZZLE COOLDOWN
                </h3>


                <button
                    class="host-cooldown-button"
                    data-time="5"
                >
                    5 SEC
                </button>


                <button
                    class="host-cooldown-button active"
                    data-time="10"
                >
                    10 SEC
                </button>


                <button
                    class="host-cooldown-button"
                    data-time="15"
                >
                    15 SEC
                </button>

            </div>


        </section>



        <div class="controls">


            <button
                id="hostStart"
                class="start-button"
            >
                ▶ START GAME
            </button>


            <button
                id="hostNext"
                class="host-next-button"
            >
                NEXT PUZZLE
            </button>


        </div>



        <div class="live-status">

            <span
                id="connectionDot"
                class="connection-dot"
            ></span>

            LIVE SCREEN READY

        </div>


    </main>


</div>



<script>


/* =================================================
   PUZZLES
================================================= */

const puzzles = {

    Animals: [

        "ELEPHANT",
        "GIRAFFE",
        "MONKEY",
        "DOLPHIN",
        "CROCODILE",
        "KANGAROO",
        "TIGER",
        "GORILLA",
        "PENGUIN",
        "ZEBRA"

    ],


    Countries: [

        "JAMAICA",
        "CANADA",
        "BRAZIL",
        "JAPAN",
        "MEXICO",
        "BAHAMAS",
        "BARBADOS",
        "FRANCE",
        "GERMANY",
        "AUSTRALIA"

    ],


    "Jamaican Phrases": [

        "WAH GWAAN",
        "WEH YUH A SEH",
        "MI DEH YA",
        "EVERYTING IRIE",
        "BIG UP",
        "WALK GOOD",
        "NO PROBLEM",
        "MEK WE GO"

    ],


    Food: [

        "JERK CHICKEN",
        "RICE AND PEAS",
        "PIZZA",
        "HAMBURGER",
        "ICE CREAM",
        "FRIED CHICKEN",
        "CURRY GOAT"

    ]

};


/* =================================================
   SETTINGS
================================================= */

let revealTime = 30;

let cooldownTime = 10;


/* =================================================
   GAME VARIABLES
================================================= */

let answer = "";

let category = "";

let revealed = [];

let seconds = 30;

let timer = null;

let gameRunning = false;


/* =================================================
   BROADCAST CHANNEL
================================================= */

const gameChannel =
    new BroadcastChannel(
        "dionlyonee-live-game"
    );


/* =================================================
   SEND STATE TO LIVE SCREEN
================================================= */

function sendGameState() {


    const state = {

        answer: answer,

        category: category,

        revealed: revealed,

        seconds: seconds,

        revealTime: revealTime,

        cooldownTime: cooldownTime,

        running: gameRunning

    };


    /*
    Send the game state directly
    to the LIVE browser tab.
    */

    gameChannel.postMessage(
        state
    );


    /*
    Keep localStorage as backup.
    */

    localStorage.setItem(

        "dionlyoneeGameState",

        JSON.stringify(
            state
        )

    );

}



/* =================================================
   ELEMENTS
================================================= */

const hostCategory =
    document.getElementById(
        "hostCategory"
    );


const hostAnswer =
    document.getElementById(
        "hostAnswer"
    );


const hostLetters =
    document.getElementById(
        "hostLetters"
    );


const hostTimer =
    document.getElementById(
        "hostTimer"
    );


const hostMessage =
    document.getElementById(
        "hostMessage"
    );


const hostStart =
    document.getElementById(
        "hostStart"
    );


const hostNext =
    document.getElementById(
        "hostNext"
    );



/* =================================================
   REVEAL TIME
================================================= */

document
    .querySelectorAll(
        ".host-time-button"
    )
    .forEach(function(button) {


        button.addEventListener(
            "click",
            function() {


                if (gameRunning) {
                    return;
                }


                document
                    .querySelectorAll(
                        ".host-time-button"
                    )
                    .forEach(function(item) {

                        item.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );


                revealTime =
                    Number(
                        button.dataset.time
                    );


                seconds =
                    revealTime;


                hostTimer.textContent =
                    seconds;


                hostMessage.textContent =
                    "LETTERS REVEAL EVERY " +
                    revealTime +
                    " SECONDS";


                sendGameState();

            }
        );

    });



/* =================================================
   COOLDOWN
================================================= */

document
    .querySelectorAll(
        ".host-cooldown-button"
    )
    .forEach(function(button) {


        button.addEventListener(
            "click",
            function() {


                if (gameRunning) {
                    return;
                }


                document
                    .querySelectorAll(
                        ".host-cooldown-button"
                    )
                    .forEach(function(item) {

                        item.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );


                cooldownTime =
                    Number(
                        button.dataset.time
                    );


                hostMessage.textContent =
                    "COOLDOWN: " +
                    cooldownTime +
                    " SECONDS";


                sendGameState();

            }
        );

    });



/* =================================================
   START
================================================= */

hostStart.addEventListener(
    "click",
    function() {

        startGame();

    }
);



/* =================================================
   ENTER
================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Enter"
            &&
            !gameRunning
        ) {

            startGame();

        }

    }
);



/* =================================================
   START GAME
================================================= */

function startGame() {


    clearInterval(
        timer
    );


    const categories =
        Object.keys(
            puzzles
        );


    category =
        categories[
            Math.floor(
                Math.random() *
                categories.length
            )
        ];


    const words =
        puzzles[
            category
        ];


    answer =
        words[
            Math.floor(
                Math.random() *
                words.length
            )
        ];


    revealed = [];


    seconds =
        revealTime;


    gameRunning = true;


    hostCategory.textContent =
        category;


    hostAnswer.textContent =
        answer;


    hostLetters.textContent =
        "NONE";


    hostTimer.textContent =
        seconds;


    hostMessage.textContent =
        "GAME LIVE — WATCH THE CHAT";


    sendGameState();


    timer =
        setInterval(
            countdown,
            1000
        );

}



/* =================================================
   COUNTDOWN
================================================= */

function countdown() {


    seconds--;


    hostTimer.textContent =
        seconds;


    sendGameState();


    if (
        seconds <= 0
    ) {

        revealLetter();

    }

}



/* =================================================
   REVEAL LETTER
================================================= */

function revealLetter() {


    clearInterval(
        timer
    );


    const hiddenLetters =
        [
            ...new Set(

                answer
                    .split("")
                    .filter(
                        function(letter) {

                            return (

                                letter !== " "

                                &&

                                !revealed.includes(
                                    letter
                                )

                            );

                        }
                    )

            )
        ];


    if (
        hiddenLetters.length === 0
    ) {

        finishGame();

        return;

    }


    const randomLetter =
        hiddenLetters[
            Math.floor(
                Math.random() *
                hiddenLetters.length
            )
        ];


    revealed.push(
        randomLetter
    );


    updateLetters();


    hostMessage.textContent =
        "LETTER REVEALED: " +
        randomLetter;


    sendGameState();


    if (
        puzzleComplete()
    ) {

        finishGame();

        return;

    }


    seconds =
        revealTime;


    hostTimer.textContent =
        seconds;


    sendGameState();


    timer =
        setInterval(
            countdown,
            1000
        );

}



/* =================================================
   LETTER DISPLAY
================================================= */

function updateLetters() {


    if (
        revealed.length === 0
    ) {

        hostLetters.textContent =
            "NONE";

        return;

    }


    hostLetters.textContent =
        revealed.join(
            " • "
        );

}



/* =================================================
   COMPLETE
================================================= */

function puzzleComplete() {


    for (
        let i = 0;
        i < answer.length;
        i++
    ) {


        const letter =
            answer[i];


        if (
            letter === " "
        ) {

            continue;

        }


        if (
            !revealed.includes(
                letter
            )
        ) {

            return false;

        }

    }


    return true;

}



/* =================================================
   FINISH
================================================= */

function finishGame() {


    clearInterval(
        timer
    );


    gameRunning = false;


    hostTimer.textContent =
        "✓";


    hostMessage.textContent =
        "PUZZLE COMPLETE";


    sendGameState();


    setTimeout(
        function() {

            startGame();

        },
        cooldownTime * 1000
    );

}



/* =================================================
   NEXT PUZZLE
================================================= */

hostNext.addEventListener(
    "click",
    function() {

        startGame();

    }
);


/* =================================================
   INITIAL STATE
================================================= */

sendGameState();


console.log(
    "DIONLYONEE HOST CONNECTED"
);


</script>


</body>

</html>
```
