<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dionlyonee Playground HOST</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<div class="host-screen">


    <header class="host-header">


        <div class="host-logo">
            D
        </div>


        <div>

            <h1>
                DIONLYONEE PLAYGROUND
            </h1>

            <p>
                HOST CONTROL PANEL
            </p>

        </div>


    </header>



    <main class="host-main">


        <!-- STATUS -->

        <div class="host-status">
            HOST CONTROL
        </div>



        <!-- CATEGORY -->

        <div class="host-label">
            CATEGORY
        </div>


        <div
            id="hostCategory"
            class="host-category"
        >
            READY
        </div>



        <!-- ANSWER -->

        <div class="host-label">
            ANSWER
        </div>


        <div
            id="answer"
            class="host-answer"
        >
            —
        </div>



        <!-- REVEALED -->

        <div class="host-label">
            REVEALED LETTERS
        </div>


        <div
            id="revealed"
            class="host-revealed"
        >
            NONE
        </div>



        <!-- TIMER -->

        <div class="host-label">
            NEXT LETTER
        </div>


        <div
            id="hostTimer"
            class="host-timer"
        >
            30
        </div>



        <!-- SETTINGS -->

        <section class="host-settings">


            <div class="host-setting">

                <h3>
                    LETTER REVEAL
                </h3>


                <button
                    class="time-button"
                    data-time="15"
                >
                    15 SEC
                </button>


                <button
                    class="time-button active"
                    data-time="30"
                >
                    30 SEC
                </button>


                <button
                    class="time-button"
                    data-time="60"
                >
                    1 MIN
                </button>

            </div>



            <div class="host-setting">

                <h3>
                    NEXT PUZZLE COOLDOWN
                </h3>


                <button
                    class="cooldown-button"
                    data-time="5"
                >
                    5 SEC
                </button>


                <button
                    class="cooldown-button active"
                    data-time="10"
                >
                    10 SEC
                </button>


                <button
                    class="cooldown-button"
                    data-time="15"
                >
                    15 SEC
                </button>

            </div>


        </section>



        <!-- GAME CONTROLS -->

        <div class="host-controls">


            <button
                id="start"
                class="start-game"
            >
                START GAME
            </button>


            <button
                id="next"
                class="next-game"
            >
                NEXT PUZZLE
            </button>


        </div>



        <div
            id="hostMessage"
            class="host-message"
        >
            READY TO START
        </div>


    </main>


</div>



<script>


/* =========================================
   CONNECTION
========================================= */

const channel =
    new BroadcastChannel(
        "dionlyonee-wheel-game"
    );



/* =========================================
   PUZZLES
========================================= */

const puzzles = {


    Countries: [

        "JAMAICA",
        "CANADA",
        "BRAZIL",
        "JAPAN",
        "MEXICO",
        "BAHAMAS",
        "BARBADOS",
        "FRANCE",
        "GERMANY",
        "AUSTRALIA"

    ],


    Animals: [

        "ELEPHANT",
        "GIRAFFE",
        "MONKEY",
        "DOLPHIN",
        "CROCODILE",
        "KANGAROO",
        "TIGER",
        "GORILLA",
        "PENGUIN",
        "ZEBRA"

    ],


    "Jamaican Phrases": [

        "WAH GWAAN",
        "WEH YUH A SEH",
        "MI DEH YA",
        "EVERYTING IRIE",
        "BIG UP",
        "WALK GOOD",
        "NO PROBLEM",
        "MEK WE GO"

    ],


    Food: [

        "JERK CHICKEN",
        "RICE AND PEAS",
        "PIZZA",
        "HAMBURGER",
        "ICE CREAM",
        "FRIED CHICKEN",
        "CURRY GOAT"

    ]

};



/* =========================================
   SETTINGS
========================================= */

let revealTime = 30;

let cooldownTime = 10;



/* =========================================
   GAME
========================================= */

let answer = "";

let category = "";

let revealed = [];

let seconds = 30;

let running = false;

let timer = null;



/* =========================================
   ELEMENTS
========================================= */

const hostCategory =
    document.getElementById(
        "hostCategory"
    );


const answerElement =
    document.getElementById(
        "answer"
    );


const revealedElement =
    document.getElementById(
        "revealed"
    );


const timerElement =
    document.getElementById(
        "hostTimer"
    );


const messageElement =
    document.getElementById(
        "hostMessage"
    );



/* =========================================
   SEND TO LIVE
========================================= */

function sendGame() {


    channel.postMessage({

        category:
            category,

        answer:
            answer,

        revealed:
            revealed,

        seconds:
            seconds,

        running:
            running

    });

}



/* =========================================
   START GAME
========================================= */

function startGame() {


    clearInterval(
        timer
    );


    const categories =
        Object.keys(
            puzzles
        );


    category =
        categories[
            Math.floor(
                Math.random() *
                categories.length
            )
        ];


    const words =
        puzzles[
            category
        ];


    answer =
        words[
            Math.floor(
                Math.random() *
                words.length
            )
        ];


    revealed = [];


    seconds =
        revealTime;


    running = true;


    hostCategory.textContent =
        category;


    answerElement.textContent =
        answer;


    revealedElement.textContent =
        "NONE";


    timerElement.textContent =
        seconds;


    messageElement.textContent =
        "GAME IS LIVE";


    sendGame();


    timer =
        setInterval(
            tick,
            1000
        );

}



/* =========================================
   TIMER
========================================= */

function tick() {


    seconds--;


    timerElement.textContent =
        seconds;


    sendGame();


    if (
        seconds <= 0
    ) {

        revealLetter();

    }

}



/* =========================================
   REVEAL LETTER
========================================= */

function revealLetter() {


    clearInterval(
        timer
    );


    const hidden =
        [
            ...new Set(

                answer
                    .split("")
                    .filter(
                        function(letter) {

                            return (

                                letter !== " "

                                &&

                                !revealed.includes(
                                    letter
                                )

                            );

                        }
                    )

            )
        ];


    if (
        hidden.length === 0
    ) {

        finishGame();

        return;

    }


    const letter =
        hidden[
            Math.floor(
                Math.random() *
                hidden.length
            )
        ];


    revealed.push(
        letter
    );


    revealedElement.textContent =
        revealed.join(
            " • "
        );


    messageElement.textContent =
        "REVEALED: " +
        letter;


    seconds =
        revealTime;


    timerElement.textContent =
        seconds;


    sendGame();


    if (
        puzzleComplete()
    ) {

        finishGame();

        return;

    }


    timer =
        setInterval(
            tick,
            1000
        );

}



/* =========================================
   PUZZLE COMPLETE
========================================= */

function puzzleComplete() {


    for (
        const letter of answer
    ) {


        if (
            letter === " "
        ) {

            continue;

        }


        if (
            !revealed.includes(
                letter
            )
        ) {

            return false;

        }

    }


    return true;

}



/* =========================================
   FINISH
========================================= */

function finishGame() {


    clearInterval(
        timer
    );


    running = false;


    messageElement.textContent =
        "PUZZLE COMPLETE";


    timerElement.textContent =
        "✓";


    sendGame();


    setTimeout(
        function() {

            startGame();

        },
        cooldownTime * 1000
    );

}



/* =========================================
   START BUTTON
========================================= */

document
    .getElementById(
        "start"
    )
    .addEventListener(
        "click",
        startGame
    );



/* =========================================
   NEXT BUTTON
========================================= */

document
    .getElementById(
        "next"
    )
    .addEventListener(
        "click",
        startGame
    );



/* =========================================
   ENTER KEY
========================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Enter"
            &&
            !running
        ) {

            startGame();

        }

    }
);



/* =========================================
   LETTER TIMER SETTINGS
========================================= */

document
    .querySelectorAll(
        ".time-button"
    )
    .forEach(
        function(button) {


            button.addEventListener(
                "click",
                function() {


                    if (running) {

                        return;

                    }


                    document
                        .querySelectorAll(
                            ".time-button"
                        )
                        .forEach(
                            function(item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    revealTime =
                        Number(
                            button.dataset.time
                        );


                    seconds =
                        revealTime;


                    timerElement.textContent =
                        seconds;

                }
            );

        }
    );



/* =========================================
   COOLDOWN SETTINGS
========================================= */

document
    .querySelectorAll(
        ".cooldown-button"
    )
    .forEach(
        function(button) {


            button.addEventListener(
                "click",
                function() {


                    if (running) {

                        return;

                    }


                    document
                        .querySelectorAll(
                            ".cooldown-button"
                        )
                        .forEach(
                            function(item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    cooldownTime =
                        Number(
                            button.dataset.time
                        );

                }
            );

        }
    );



console.log(
    "DIONLYONEE HOST READY"
);


</script>


</body>

</html>
