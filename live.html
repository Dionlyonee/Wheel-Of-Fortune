<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dionlyonee Playground - LIVE</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body class="live-page">


<div class="live-screen">


    <!-- =========================================
         TOP BAR
    ========================================== -->

    <div class="live-topbar">

        <div class="brand">

            <div class="brand-logo">
                D
            </div>

            <div class="brand-text">

                <div class="brand-name">
                    DIONLYONEE PLAYGROUND
                </div>

                <div class="brand-game">
                    WHEEL OF FORTUNE
                </div>

            </div>

        </div>


        <div class="live-indicator">

            <span class="live-light"></span>

            LIVE

        </div>

    </div>



    <!-- =========================================
         GAME AREA
    ========================================== -->

    <div class="game-board">


        <!-- CATEGORY -->

        <div class="category-title">
            CATEGORY
        </div>


        <div
            id="liveCategory"
            class="category-name"
        >
            WAITING FOR GAME
        </div>



        <!-- =====================================
             PUZZLE BOARD
        ====================================== -->

        <div
            id="puzzleBoard"
            class="puzzle-board"
        >


            <!-- DEMO BOXES
                 These disappear when a real
                 puzzle arrives.
            -->

            <div class="letter-box"></div>

            <div class="letter-box"></div>

            <div class="letter-box"></div>

            <div class="letter-box"></div>

            <div class="letter-box"></div>

            <div class="letter-box"></div>

            <div class="letter-box"></div>


        </div>



        <!-- =====================================
             TIMER
        ====================================== -->

        <div class="timer-section">

            <div class="timer-title">
                NEXT LETTER
            </div>


            <div
                id="liveTimer"
                class="big-timer"
            >
                —
            </div>


            <div class="timer-caption">
                SECONDS
            </div>

        </div>



        <!-- =====================================
             MESSAGE
        ====================================== -->

        <div
            id="liveMessage"
            class="chat-message"
        >
            GUESS THE ANSWER IN CHAT
        </div>


    </div>



    <!-- =========================================
         BOTTOM BAR
    ========================================== -->

    <div class="live-bottom">

        <div>
            GUESS IN CHAT
        </div>

        <div class="bottom-divider">
            ◆
        </div>

        <div>
            DIONLYONEE
        </div>

    </div>


</div>



<script>


/* =================================================
   DIONLYONEE PLAYGROUND
   LIVE DISPLAY
================================================= */


/* =================================================
   CHANNEL
================================================= */

let gameChannel = null;


if (
    "BroadcastChannel" in window
) {

    gameChannel =
        new BroadcastChannel(
            "dionlyonee-wheel-game"
        );

}



/* =================================================
   ELEMENTS
================================================= */

const category =
    document.getElementById(
        "liveCategory"
    );


const board =
    document.getElementById(
        "puzzleBoard"
    );


const timer =
    document.getElementById(
        "liveTimer"
    );


const message =
    document.getElementById(
        "liveMessage"
    );



/* =================================================
   DRAW PUZZLE
================================================= */

function drawPuzzle(
    answer,
    revealed
) {


    board.innerHTML = "";


    if (
        !answer
    ) {

        createDemoBoard();

        return;

    }


    const words =
        answer.split(" ");


    words.forEach(
        function(word, wordIndex) {


            const wordContainer =
                document.createElement(
                    "div"
                );


            wordContainer.className =
                "word-group";


            for (
                let i = 0;
                i < word.length;
                i++
            ) {


                const letter =
                    word[i];


                const box =
                    document.createElement(
                        "div"
                    );


                box.className =
                    "letter-box";


                if (
                    revealed &&
                    revealed.includes(
                        letter
                    )
                ) {

                    box.textContent =
                        letter;

                    box.classList.add(
                        "revealed"
                    );

                }


                wordContainer.appendChild(
                    box
                );

            }


            board.appendChild(
                wordContainer
            );

        }
    );

}



/* =================================================
   DEMO BOARD
================================================= */

function createDemoBoard() {


    board.innerHTML = "";


    const demoWords =
        [
            7
        ];


    demoWords.forEach(
        function(count) {


            const group =
                document.createElement(
                    "div"
                );


            group.className =
                "word-group";


            for (
                let i = 0;
                i < count;
                i++
            ) {

                const box =
                    document.createElement(
                        "div"
                    );


                box.className =
                    "letter-box";


                group.appendChild(
                    box
                );

            }


            board.appendChild(
                group
            );

        }
    );

}



/* =================================================
   UPDATE GAME
================================================= */

function updateGame(
    state
) {


    if (
        !state
    ) {

        return;

    }


    category.textContent =
        state.category ||
        "WAITING FOR GAME";


    drawPuzzle(
        state.answer,
        state.revealed
    );


    if (
        state.running
    ) {

        timer.textContent =
            state.seconds;

        message.textContent =
            "GUESS THE ANSWER IN CHAT";

    }
    else {

        timer.textContent =
            "—";

        message.textContent =
            "GET READY FOR THE NEXT PUZZLE";

    }

}



/* =================================================
   RECEIVE HOST DATA
================================================= */

if (
    gameChannel
) {


    gameChannel.onmessage =
        function(event) {


            console.log(
                "HOST → LIVE",
                event.data
            );


            updateGame(
                event.data
            );

        };

}



/* =================================================
   START WITH DEMO BOARD
================================================= */

createDemoBoard();


console.log(
    "DIONLYONEE LIVE DISPLAY READY"
);


</script>


</body>

</html>
