/* =========================================
   GAME VARIABLES
========================================= */

let revealTime = 30;
let seconds = 30;
let gameTimer = null;


/* =========================================
   ELEMENTS
========================================= */

const categoryElement =
document.getElementById("category");

const answerElement =
document.getElementById("answer");

const timerElement =
document.getElementById("timer");

const messageElement =
document.getElementById("message");

const connectionStatus =
document.getElementById("connectionStatus");


/* =========================================
   SEND TO LIVE
========================================= */

function sendToLive(data) {

    liveChannel.postMessage(data);

    connectionStatus.textContent = "CONNECTED";

}


/* =========================================
   RANDOM PUZZLE
========================================= */

function getPuzzle() {

    const categories =
    Object.keys(puzzles);

    const randomCategory =
    categories[
        Math.floor(
            Math.random() *
            categories.length
        )
    ];

    const words =
    puzzles[randomCategory];

    const randomWord =
    words[
        Math.floor(
            Math.random() *
            words.length
        )
    ];

    return {
        category: randomCategory,
        answer: randomWord
    };

}


/* =========================================
   START GAME
========================================= */

function startGame() {

    clearInterval(gameTimer);

    const puzzle = getPuzzle();

    seconds = revealTime;

    categoryElement.textContent =
    puzzle.category;

    answerElement.textContent =
    puzzle.answer;

    timerElement.textContent =
    seconds;

    messageElement.textContent =
    "GAME IS LIVE";


    sendToLive({

        type: "START_GAME",

        category: puzzle.category,

        answer: puzzle.answer,

        time: revealTime

    });


    gameTimer =
    setInterval(function() {

        seconds--;

        timerElement.textContent =
        seconds;


        sendToLive({

            type: "TIMER",

            seconds: seconds

        });


        if (seconds <= 0) {

            clearInterval(gameTimer);

            sendToLive({

                type: "REVEAL"

            });

            messageElement.textContent =
            "LETTER REVEAL";

        }

    }, 1000);

}


/* =========================================
   NEXT PUZZLE
========================================= */

function nextPuzzle() {

    startGame();

}


/* =========================================
   TIME
========================================= */

function changeTime(time) {

    revealTime = time;

    seconds = time;

    timerElement.textContent =
    time;


    document
    .querySelectorAll(".time-button")
    .forEach(function(button) {

        button.classList.remove("selected");

    });


    if (time === 15) {

        document
        .getElementById("time15")
        .classList.add("selected");

    }

    if (time === 30) {

        document
        .getElementById("time30")
        .classList.add("selected");

    }

    if (time === 60) {

        document
        .getElementById("time60")
        .classList.add("selected");

    }


    messageElement.textContent =
    "REVEAL TIME: " +
    time +
    " SECONDS";


    sendToLive({

        type: "TIME_CHANGE",

        time: time

    });

}
